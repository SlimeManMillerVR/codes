
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SUBWAY II</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Arial Black",Impact,sans-serif}
body{background:linear-gradient(135deg,#70e69a,#46a875 35%,#7856b8 75%,#b39be9);color:white;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent}

/* MAIN MENU */
#mainScreen{
 position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
 background:linear-gradient(135deg,#70e69a,#46a875 35%,#7856b8 75%,#b39be9);z-index:10
}
#mainScreen:before{
 content:"";position:absolute;inset:0;
 background-image:linear-gradient(#ffffff16 2px,transparent 2px),linear-gradient(90deg,#ffffff16 2px,transparent 2px);
 background-size:48px 48px;pointer-events:none
}
.menu{position:relative;width:min(440px,90%);text-align:center}
.logo{font-size:clamp(43px,10vw,68px);font-weight:1000;letter-spacing:-2px;transform:rotate(-5deg);text-shadow:4px 4px 0 #555078,7px 7px 0 #38314f;margin-bottom:45px}
.buttons{width:min(290px,100%);margin:auto;display:flex;flex-direction:column;gap:16px}
.menuButton{min-height:55px;border:3px solid #514582;background:#6e64b9;color:white;font-size:21px;font-weight:900;letter-spacing:2px;box-shadow:0 6px 0 #42375f}
.menuButton:active{transform:translateY(3px)}
.backButton{background:#559b83;border-color:#34735e;box-shadow:0 6px 0 #285644}

/* GAME */
#gameScreen{display:none;position:fixed;inset:0;overflow:hidden;background:#858585;touch-action:none}
#gameCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}

#gameBack{
 position:absolute;z-index:10;top:15px;left:15px;width:100px;height:43px;
 border:3px solid #333;background:#555;color:white;font-size:15px;box-shadow:0 4px 0 #222;touch-action:manipulation
}

/* MOVEMENT ARROWS */
#movement{
 position:absolute;z-index:10;top:18px;right:18px;width:150px;height:150px;
 display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
 gap:5px;touch-action:none
}
.moveButton{
 display:flex;align-items:center;justify-content:center;
 border:2px solid #dedede;border-radius:7px;background:#292929d9;color:white;
 font-family:Arial,sans-serif;font-size:25px;font-weight:bold;padding:0;
 box-shadow:0 3px 0 #111;touch-action:none
}
.moveButton.active{background:#777;border-color:white;transform:translateY(2px);box-shadow:0 1px 0 #111}
#forward{grid-area:1/2}
#left{grid-area:2/1}
#backward{grid-area:2/2}
#right{grid-area:2/3}

/* SHOOT BESIDE THE ARROWS */
#shootButton{
 display:none;
 position:absolute;
 z-index:12;
 top:18px;
 right:178px;
 width:150px;
 height:150px;
 border:4px solid #f3e5a0;
 border-radius:12px;
 background:#e8c900;
 color:#242000;
 font-size:25px;
 font-weight:1000;
 letter-spacing:1px;
 box-shadow:0 6px 0 #9c8700;
 align-items:center;
 justify-content:center;
 touch-action:manipulation
}
#shootButton:active{
 transform:translateY(4px);
 box-shadow:0 2px 0 #9c8700;
 background:#ffe83d
}

/* INSTRUCTIONS */
#hint{
 position:absolute;z-index:5;bottom:15px;left:50%;transform:translateX(-50%);
 width:90%;text-align:center;color:white;font:bold 13px Arial,sans-serif;
 text-shadow:1px 2px 3px black;pointer-events:none
}

@media(max-width:600px){
 #movement{top:12px;right:12px;width:132px;height:132px;gap:4px}
 .moveButton{font-size:22px}
 #shootButton{top:12px;right:152px;width:132px;height:132px;font-size:19px}
 #gameBack{top:12px;left:12px;width:82px;height:39px;font-size:13px}
 #hint{font-size:11px;bottom:10px}
}
</style>
</head>

<body>

<div id="mainScreen">
 <div class="menu">
  <div class="logo">SUBWAY II</div>
  <div class="buttons">
   <button class="menuButton" id="playButton">PLAY</button>
   <button class="menuButton backButton" id="menuBackButton">BACK</button>
  </div>
 </div>
</div>

<div id="gameScreen">
 <canvas id="gameCanvas"></canvas>

 <button id="gameBack">BACK</button>

 <div id="movement">
  <button class="moveButton" id="forward" aria-label="Move forward">▲</button>
  <button class="moveButton" id="left" aria-label="Move left">◀</button>
  <button class="moveButton" id="backward" aria-label="Move backward">▼</button>
  <button class="moveButton" id="right" aria-label="Move right">▶</button>
 </div>

 <button id="shootButton">SHOOT</button>

 <div id="hint">DRAG TO LOOK • USE ARROWS TO MOVE • TAP GUN TO PICK UP</div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

const mainScreen=document.getElementById("mainScreen");
const gameScreen=document.getElementById("gameScreen");
const canvas=document.getElementById("gameCanvas");
const movement=document.getElementById("movement");
const shootButton=document.getElementById("shootButton");
const hint=document.getElementById("hint");

let renderer,scene,camera,gunPickup;
let playing=false,initialized=false,hasGun=false;
let playerX=0,playerZ=3,yaw=0,pitch=0;
let dragging=false,dragPointerId=null;
let dragStartX=0,dragStartY=0,lastX=0,lastY=0,pointerMoved=false;
let animationId=null,previousTime=0;

const keys={forward:false,backward:false,left:false,right:false};
const projectiles=[];
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
const direction=new THREE.Vector3();

function mat(color,roughness=1,metalness=0){
 return new THREE.MeshStandardMaterial({color,roughness,metalness});
}

function box(parent,size,position,material){
 const mesh=new THREE.Mesh(new THREE.BoxGeometry(...size),material);
 mesh.position.set(...position);
 parent.add(mesh);
 return mesh;
}

/* GUN ON THE FLOOR */
function createGun(parent){
 const gun=new THREE.Group();
 const metal=mat(0x777777,.55,.35);
 const lightMetal=mat(0x999999,.5,.35);
 const darkMetal=mat(0x292929,.8,.1);

 box(gun,[.20,.17,.64],[0,.05,0],metal);
 box(gun,[.16,.09,.46],[0,.15,-.015],lightMetal);
 box(gun,[.105,.105,.36],[0,.12,-.47],darkMetal);
 box(gun,[.07,.07,.045],[0,.12,-.66],mat(0x111111));

 const grip=box(gun,[.17,.34,.20],[0,-.19,.16],darkMetal);
 grip.rotation.x=-.20;

 for(let i=0;i<4;i++){
  const line=box(gun,[.176,.018,.205],[0,-.11-i*.065,.16],mat(0x505050));
  line.rotation.x=-.20;
 }

 const guard=new THREE.Mesh(new THREE.TorusGeometry(.075,.012,6,12,Math.PI),darkMetal);
 guard.rotation.x=Math.PI/2;
 guard.position.set(0,-.08,.12);
 gun.add(guard);

 parent.add(gun);
 return gun;
}

/* BUILD ROOM */
function buildWorld(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x858585);
 scene.fog=new THREE.Fog(0x858585,22,45);

 camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,100);
 camera.rotation.order="YXZ";

 renderer=new THREE.WebGLRenderer({canvas,antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.setSize(innerWidth,innerHeight);
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;
 renderer.toneMappingExposure=1.15;

 scene.add(new THREE.HemisphereLight(0xffffff,0x555555,2));

 const light=new THREE.DirectionalLight(0xffffff,2);
 light.position.set(-4,9,5);
 scene.add(light);

 const floorMat=mat(0x696969);
 const wallMat=mat(0x929292);
 const sideMat=mat(0x777777);
 const ceilingMat=mat(0xa1a1a1);

 box(scene,[12,.2,12],[0,-.1,0],floorMat);
 box(scene,[12,.2,12],[0,4.2,0],ceilingMat);

 box(scene,[12,4,.2],[0,2,-6],wallMat);
 box(scene,[12,4,.2],[0,2,6],wallMat);
 box(scene,[.2,4,12],[-6,2,0],sideMat);
 box(scene,[.2,4,12],[6,2,0],sideMat);

 const lineMat=mat(0x626262);
 for(let i=-5;i<=5;i++){
  box(scene,[.015,.008,12],[i,.006,0],lineMat);
  box(scene,[12,.008,.015],[0,.006,i],lineMat);
 }

 gunPickup=new THREE.Group();
 gunPickup.position.set(0,.18,.7);
 gunPickup.rotation.y=.25;
 createGun(gunPickup);
 scene.add(gunPickup);
 scene.add(camera);
}

/* CAMERA */
function updateCamera(){
 camera.rotation.order="YXZ";
 camera.rotation.y=yaw;
 camera.rotation.x=pitch;
 camera.position.set(playerX,1.7,playerZ);
}

/* PICK UP GUN */
function pickUpGun(){
 if(hasGun)return;

 hasGun=true;

 // Remove the gun from the floor.
 scene.remove(gunPickup);

 // Keep the movement arrows and show SHOOT beside them.
 movement.style.display="grid";
 shootButton.style.display="flex";

 hint.textContent="PRESS SHOOT TO FIRE A FAST YELLOW PROJECTILE";
}

/* SHOOT A YELLOW RECTANGLE */
function shoot(){
 if(!playing||!hasGun)return;

 camera.getWorldDirection(direction).normalize();

 const start=camera.position.clone().add(direction.clone().multiplyScalar(.8));

 const projectileMaterial=new THREE.MeshBasicMaterial({color:0xffe500});
 const projectileMesh=new THREE.Mesh(
  new THREE.BoxGeometry(.18,.18,.48),
  projectileMaterial
 );

 projectileMesh.position.copy(start);
 projectileMesh.quaternion.setFromUnitVectors(
  new THREE.Vector3(0,0,1),
  direction
 );

 scene.add(projectileMesh);

 projectiles.push({
  mesh:projectileMesh,
  direction:direction.clone(),
  speed:38,
  stopped:false,
  age:0
 });
}

shootButton.addEventListener("pointerdown",event=>{
 event.preventDefault();
 event.stopPropagation();
 shoot();
});

/* CLEAR INPUT */
function clearControls(){
 for(const key in keys)keys[key]=false;

 document.querySelectorAll(".moveButton").forEach(button=>{
  button.classList.remove("active");
 });

 dragging=false;
 dragPointerId=null;
}

/* START GAME */
function startGame(){
 mainScreen.style.display="none";
 gameScreen.style.display="block";

 if(!initialized){
  buildWorld();
  initialized=true;
 }

 playerX=0;
 playerZ=3;
 yaw=0;
 pitch=0;
 hasGun=false;

 for(const p of projectiles){
  scene.remove(p.mesh);
 }
 projectiles.length=0;

 if(gunPickup)scene.remove(gunPickup);

 gunPickup=new THREE.Group();
 gunPickup.position.set(0,.18,.7);
 gunPickup.rotation.y=.25;
 createGun(gunPickup);
 scene.add(gunPickup);

 movement.style.display="grid";
 shootButton.style.display="none";
 hint.textContent="DRAG TO LOOK • USE ARROWS TO MOVE • TAP GUN TO PICK UP";

 clearControls();
 updateCamera();

 playing=true;
 previousTime=performance.now();

 if(animationId!==null)cancelAnimationFrame(animationId);
 animate(previousTime);

 renderer.setSize(innerWidth,innerHeight);
}

function backToMenu(){
 playing=false;

 if(animationId!==null){
  cancelAnimationFrame(animationId);
  animationId=null;
 }

 clearControls();
 gameScreen.style.display="none";
 mainScreen.style.display="flex";
}

document.getElementById("playButton").addEventListener("click",startGame);
document.getElementById("menuBackButton").addEventListener("click",()=>{
 location.href="index.html";
});
document.getElementById("gameBack").addEventListener("click",backToMenu);

/* MOVEMENT BUTTONS */
const movementButtons={
 forward:document.getElementById("forward"),
 backward:document.getElementById("backward"),
 left:document.getElementById("left"),
 right:document.getElementById("right")
};

for(const [directionName,button] of Object.entries(movementButtons)){
 button.addEventListener("pointerdown",event=>{
  event.preventDefault();
  event.stopPropagation();

  keys[directionName]=true;
  button.classList.add("active");

  try{button.setPointerCapture(event.pointerId)}catch(error){}
 });

 const release=()=>{
  keys[directionName]=false;
  button.classList.remove("active");
 };

 button.addEventListener("pointerup",release);
 button.addEventListener("pointercancel",release);
 button.addEventListener("lostpointercapture",release);
 button.addEventListener("contextmenu",event=>event.preventDefault());
}

/* KEYBOARD */
const keyboardMap={
 ArrowUp:"forward",KeyW:"forward",
 ArrowDown:"backward",KeyS:"backward",
 ArrowLeft:"left",KeyA:"left",
 ArrowRight:"right",KeyD:"right"
};

window.addEventListener("keydown",event=>{
 if(!playing)return;

 const key=keyboardMap[event.code];
 if(key){
  keys[key]=true;
  event.preventDefault();
 }
});

window.addEventListener("keyup",event=>{
 const key=keyboardMap[event.code];
 if(key){
  keys[key]=false;
  event.preventDefault();
 }
});

window.addEventListener("blur",clearControls);

/* CAMERA LOOK */
canvas.addEventListener("pointerdown",event=>{
 if(!playing)return;
 if(event.pointerType==="mouse"&&event.button!==0)return;

 dragging=true;
 dragPointerId=event.pointerId;

 dragStartX=lastX=event.clientX;
 dragStartY=lastY=event.clientY;
 pointerMoved=false;

 try{canvas.setPointerCapture(event.pointerId)}catch(error){}
 event.preventDefault();
});

canvas.addEventListener("pointermove",event=>{
 if(!playing||!dragging||event.pointerId!==dragPointerId)return;

 const dx=event.clientX-lastX;
 const dy=event.clientY-lastY;

 if(Math.abs(event.clientX-dragStartX)>3||
    Math.abs(event.clientY-dragStartY)>3){
  pointerMoved=true;
 }

 yaw-=dx*.004;
 pitch-=dy*.003;
 pitch=THREE.MathUtils.clamp(pitch,-1.35,1.35);

 lastX=event.clientX;
 lastY=event.clientY;

 event.preventDefault();
});

function attemptPickup(clientX,clientY){
 if(!playing||hasGun||!gunPickup)return;

 const rect=canvas.getBoundingClientRect();
 pointer.x=((clientX-rect.left)/rect.width)*2-1;
 pointer.y=-((clientY-rect.top)/rect.height)*2+1;

 raycaster.setFromCamera(pointer,camera);

 if(raycaster.intersectObject(gunPickup,true).length>0){
  pickUpGun();
 }
}

canvas.addEventListener("pointerup",event=>{
 if(!dragging||event.pointerId!==dragPointerId)return;

 const moved=pointerMoved;
 const x=event.clientX;
 const y=event.clientY;

 dragging=false;
 dragPointerId=null;

 if(!moved)attemptPickup(x,y);

 event.preventDefault();
});

canvas.addEventListener("pointercancel",event=>{
 if(event.pointerId===dragPointerId){
  dragging=false;
  dragPointerId=null;
 }
});

canvas.addEventListener("contextmenu",event=>event.preventDefault());

/* PROJECTILES */
function updateProjectiles(dt){
 for(const p of projectiles){
  if(p.stopped)continue;

  p.mesh.position.addScaledVector(p.direction,p.speed*dt);
  p.age+=dt;

  const pos=p.mesh.position;

  // Stop at the room boundaries.
  const hitWall=
   pos.x<=-5.82||pos.x>=5.82||
   pos.z<=-5.82||pos.z>=5.82||
   pos.y<=.12||pos.y>=4.05;

  if(hitWall){
   pos.x=THREE.MathUtils.clamp(pos.x,-5.82,5.82);
   pos.y=THREE.MathUtils.clamp(pos.y,.12,4.05);
   pos.z=THREE.MathUtils.clamp(pos.z,-5.82,5.82);
   p.stopped=true;
  }

  // Clean up old projectiles.
  if(p.age>12){
   scene.remove(p.mesh);
   p.stopped=true;
  }
 }
}

/* GAME LOOP */
function animate(now){
 if(!playing){
  animationId=null;
  return;
 }

 animationId=requestAnimationFrame(animate);

 const dt=Math.min((now-previousTime)/1000,.05);
 previousTime=now;

 let forward=Number(keys.forward)-Number(keys.backward);
 let sideways=Number(keys.right)-Number(keys.left);

 const length=Math.hypot(forward,sideways);
 if(length>1){
  forward/=length;
  sideways/=length;
 }

 const speed=4*dt;

 playerX+=(-Math.sin(yaw)*forward+Math.cos(yaw)*sideways)*speed;
 playerZ+=(-Math.cos(yaw)*forward-Math.sin(yaw)*sideways)*speed;

 playerX=THREE.MathUtils.clamp(playerX,-5.35,5.35);
 playerZ=THREE.MathUtils.clamp(playerZ,-5.35,5.35);

 updateCamera();
 updateProjectiles(dt);

 renderer.render(scene,camera);
}

/* RESIZE */
window.addEventListener("resize",()=>{
 if(!renderer||!camera)return;

 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
