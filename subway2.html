
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SUBWAY II</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "Arial Black", Impact, sans-serif;
}

body {
    background: linear-gradient(135deg, #70e69a, #46a875 35%, #7856b8 75%, #b39be9);
    color: white;
}

/* MAIN MENU */

#mainScreen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #70e69a, #46a875 35%, #7856b8 75%, #b39be9);
}

#mainScreen::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(#ffffff16 2px, transparent 2px),
        linear-gradient(90deg, #ffffff16 2px, transparent 2px);
    background-size: 48px 48px;
}

.menu {
    position: relative;
    width: min(440px, 90%);
    text-align: center;
}

.logo {
    font-size: clamp(43px, 10vw, 68px);
    font-weight: 1000;
    letter-spacing: -2px;
    transform: rotate(-5deg);
    text-shadow:
        4px 4px 0 #555078,
        7px 7px 0 #38314f;
    margin-bottom: 45px;
}

.buttons {
    width: min(290px, 100%);
    margin: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

button {
    min-height: 55px;
    width: 100%;
    border: 3px solid #514582;
    background: #6e64b9;
    color: white;
    font-family: "Arial Black", Impact, sans-serif;
    font-size: 21px;
    font-weight: 900;
    letter-spacing: 2px;
    box-shadow: 0 6px 0 #42375f;
    cursor: pointer;
    touch-action: manipulation;
}

button:hover {
    background: #8278d4;
}

button:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #42375f;
}

.backButton {
    background: #559b83;
    border-color: #34735e;
    box-shadow: 0 6px 0 #285644;
}

.backButton:hover {
    background: #69b895;
}

/* GAME */

#gameScreen {
    display: none;
    position: fixed;
    inset: 0;
    background: #858585;
    overflow: hidden;
    perspective: 700px;
    touch-action: none;
}

/* First-person gray room */

#room {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: #888888;
}

#ceiling {
    position: absolute;
    top: 0;
    left: -30%;
    width: 160%;
    height: 50%;
    background: #a2a2a2;
    clip-path: polygon(19% 0, 81% 0, 100% 100%, 0 100%);
}

#floor {
    position: absolute;
    bottom: 0;
    left: -30%;
    width: 160%;
    height: 55%;
    background: #696969;
    clip-path: polygon(0 0, 100% 0, 82% 100%, 18% 100%);
}

#backWall {
    position: absolute;
    top: 18%;
    left: 25%;
    width: 50%;
    height: 48%;
    background: #969696;
    border: 3px solid #777777;
}

#leftWall {
    position: absolute;
    top: 0;
    left: 0;
    width: 26%;
    height: 100%;
    background: #777777;
    clip-path: polygon(0 0, 100% 18%, 100% 66%, 0 100%);
}

#rightWall {
    position: absolute;
    top: 0;
    right: 0;
    width: 26%;
    height: 100%;
    background: #777777;
    clip-path: polygon(0 18%, 100% 0, 100% 100%, 0 66%);
}

/* The cube */

#cube {
    position: absolute;
    width: 72px;
    height: 72px;
    left: 50%;
    top: 64%;
    transform: translate(-50%, -50%);
    background: #b8b8b8;
    border: 2px solid #8c8c8c;
    box-shadow: 8px 8px 0 #5c5c5c;
    cursor: pointer;
    touch-action: manipulation;
}

#cube::before {
    content: "";
    position: absolute;
    left: -2px;
    top: -17px;
    width: 72px;
    height: 16px;
    background: #d1d1d1;
    border: 2px solid #8c8c8c;
    transform: skewY(-15deg);
    transform-origin: bottom;
}

#cube::after {
    content: "";
    position: absolute;
    top: -9px;
    right: -17px;
    width: 16px;
    height: 72px;
    background: #777777;
    border: 2px solid #666666;
    transform: skewY(-35deg);
    transform-origin: left;
}

/* Small aiming dot */

#crosshair {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 5px;
    height: 5px;
    background: white;
    border: 1px solid #333;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
}

/* Held dark gray rectangle */

#heldObject {
    display: none;
    position: absolute;
    width: 110px;
    height: 82px;
    right: 12%;
    bottom: 7%;
    background: #414141;
    border: 3px solid #292929;
    box-shadow: 9px 9px 0 #222222;
    transform: perspective(250px) rotateY(-12deg) rotateX(5deg);
}

#heldObject::before {
    content: "";
    position: absolute;
    left: -3px;
    top: -19px;
    width: 110px;
    height: 17px;
    background: #575757;
    border: 3px solid #292929;
    transform: skewY(-8deg);
}

#heldObject::after {
    content: "";
    position: absolute;
    top: -10px;
    right: -20px;
    width: 17px;
    height: 82px;
    background: #303030;
    border: 3px solid #222222;
    transform: skewY(-35deg);
}

#gameBack {
    position: absolute;
    z-index: 10;
    top: 15px;
    left: 15px;
    width: 110px;
    min-height: 42px;
    font-size: 15px;
    background: #555555;
    border-color: #333333;
    box-shadow: 0 4px 0 #222222;
}

#gameHint {
    position: absolute;
    z-index: 5;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    font-family: Arial, sans-serif;
    font-size: 13px;
    color: white;
    text-shadow: 1px 1px 3px black;
    text-align: center;
    width: 90%;
    pointer-events: none;
}

@media (max-width: 600px) {
    #cube {
        width: 58px;
        height: 58px;
        top: 63%;
    }

    #cube::before {
        width: 58px;
    }

    #cube::after {
        height: 58px;
    }

    #heldObject {
        width: 85px;
        height: 65px;
        right: 10%;
        bottom: 9%;
    }

    #heldObject::before {
        width: 85px;
    }

    #heldObject::after {
        height: 65px;
    }
}
</style>
</head>

<body>

<!-- MENU -->
<div id="mainScreen">
    <div class="menu">
        <div class="logo">SUBWAY II</div>

        <div class="buttons">
            <button id="playButton">PLAY</button>
            <button class="backButton" id="menuBackButton">BACK</button>
        </div>
    </div>
</div>

<!-- GAME -->
<div id="gameScreen">
    <div id="room">
        <div id="ceiling"></div>
        <div id="floor"></div>
        <div id="backWall"></div>
        <div id="leftWall"></div>
        <div id="rightWall"></div>

        <div id="cube" aria-label="Pick up cube"></div>

        <div id="crosshair"></div>
        <div id="heldObject"></div>

        <button id="gameBack">BACK</button>

        <div id="gameHint">CLICK OR TAP THE CUBE TO PICK IT UP</div>
    </div>
</div>

<script>
const mainScreen = document.getElementById("mainScreen");
const gameScreen = document.getElementById("gameScreen");
const cube = document.getElementById("cube");
const heldObject = document.getElementById("heldObject");
const gameHint = document.getElementById("gameHint");

document.getElementById("playButton").addEventListener("click", function() {
    mainScreen.style.display = "none";
    gameScreen.style.display = "block";
});

document.getElementById("menuBackButton").addEventListener("click", function() {
    window.location.href = "index.html";
});

document.getElementById("gameBack").addEventListener("click", function(event) {
    event.stopPropagation();
    gameScreen.style.display = "none";
    mainScreen.style.display = "flex";
});

/* Pick up the cube by clicking or tapping */
function pickUpCube() {
    heldObject.style.display = "block";
    cube.style.display = "none";
    gameHint.textContent = "CUBE PICKED UP";
}

cube.addEventListener("click", function(event) {
    event.stopPropagation();
    pickUpCube();
});

cube.addEventListener("touchend", function(event) {
    event.preventDefault();
    pickUpCube();
}, { passive: false });
</script>

</body>
</html>
