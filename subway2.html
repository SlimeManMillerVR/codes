
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SUBWAY II</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:"Arial Black",Impact,sans-serif;
}

body{
    background:linear-gradient(135deg,#70e69a,#46a875 35%,#7856b8 75%,#b39be9);
    color:white;
    user-select:none;
    -webkit-user-select:none;
}

button{
    font-family:inherit;
    cursor:pointer;
    touch-action:none;
    -webkit-tap-highlight-color:transparent;
}

/* MAIN MENU */

#mainScreen{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#70e69a,#46a875 35%,#7856b8 75%,#b39be9);
    z-index:10;
}

#mainScreen:before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
        linear-gradient(#ffffff16 2px,transparent 2px),
        linear-gradient(90deg,#ffffff16 2px,transparent 2px);
    background-size:48px 48px;
    pointer-events:none;
}

.menu{
    position:relative;
    width:min(440px,90%);
    text-align:center;
}

.logo{
    font-size:clamp(43px,10vw,68px);
    font-weight:1000;
    letter-spacing:-2px;
    transform:rotate(-5deg);
    text-shadow:4px 4px 0 #555078,7px 7px 0 #38314f;
    margin-bottom:45px;
}

.buttons{
    width:min(290px,100%);
    margin:auto;
    display:flex;
    flex-direction:column;
    gap:16px;
}

.menuButton{
    min-height:55px;
    border:3px solid #514582;
    background:#6e64b9;
    color:white;
    font-size:21px;
    font-weight:900;
    letter-spacing:2px;
    box-shadow:0 6px 0 #42375f;
}

.menuButton:active{
    transform:translateY(3px);
}

.backButton{
    background:#559b83;
    border-color:#34735e;
    box-shadow:0 6px 0 #285644;
}

/* GAME */

#gameScreen{
    display:none;
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#858585;
    touch-action:none;
}

#gameCanvas{
    position:absolute;
    inset:0;
    display:block;
    width:100%;
    height:100%;
    outline:none;
    touch-action:none;
}

/* BACK BUTTON */

#gameBack{
    position:absolute;
    z-index:10;
    top:15px;
    left:15px;
    width:100px;
    height:43px;
    border:3px solid #333;
    background:#555;
    color:white;
    font-size:15px;
    box-shadow:0 4px 0 #222;
    touch-action:manipulation;
}

/* MOVEMENT PAD */

#movement{
    position:absolute;
    z-index:10;
    top:18px;
    right:18px;
    width:150px;
    height:150px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    gap:5px;
    touch-action:none;
    pointer-events:none;
}

.moveButton{
    pointer-events:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    border:2px solid #dedede;
    border-radius:7px;
    background:#292929d9;
    color:white;
    font-family:Arial,sans-serif;
    font-size:25px;
    font-weight:bold;
    padding:0;
    box-shadow:0 3px 0 #111;
    touch-action:none;
}

.moveButton.active{
    background:#777;
    border-color:white;
    transform:translateY(2px);
    box-shadow:0 1px 0 #111;
}

#forward{grid-area:1/2}
#left{grid-area:2/1}
#backward{grid-area:2/2}
#right{grid-area:2/3}

/* INSTRUCTIONS */

#hint{
    position:absolute;
    z-index:5;
    bottom:15px;
    left:50%;
    transform:translateX(-50%);
    width:90%;
    text-align:center;
    color:white;
    font:bold 13px Arial,sans-serif;
    text-shadow:1px 2px 3px black;
    pointer-events:none;
}

/* HELD GUN */

#heldGun{
    display:none;
    position:absolute;
    z-index:4;
    right:5%;
    bottom:-2%;
    width:190px;
    height:180px;
    pointer-events:none;
    transform:rotate(-8deg);
}

#heldGun .barrel{
    position:absolute;
    width:95px;
    height:23px;
    right:8px;
    top:35px;
    background:linear-gradient(#bcbcbc,#686868);
    border:2px solid #3b3b3b;
    border-radius:3px;
}

#heldGun .barrel:after{
    content:"";
    position:absolute;
    right:-3px;
    top:4px;
    height:11px;
    width:8px;
    background:#252525;
}

#heldGun .slide{
    position:absolute;
    right:10px;
    top:51px;
    width:120px;
    height:37px;
    background:linear-gradient(130deg,#999,#494949);
    border:3px solid #333;
    border-radius:4px 4px 7px 7px;
}

#heldGun .slide:before{
    content:"";
    position:absolute;
    left:10px;
    top:5px;
    width:70px;
    height:3px;
    background:#333;
}

#heldGun .grip{
    position:absolute;
    top:77px;
    right:45px;
    width:39px;
    height:83px;
    background:linear-gradient(90deg,#292929,#555,#303030);
    border:3px solid #222;
    border-radius:3px 3px 9px 9px;
    transform:rotate(-15deg);
}

#heldGun .grip:after{
    content:"";
    position:absolute;
    inset:10px 5px;
    background:repeating-linear-gradient(0deg,transparent 0 8px,#222 9px 11px);
}

#heldGun .trigger{
    position:absolute;
    right:77px;
    top:83px;
    width:24px;
    height:25px;
    border:4px solid #303030;
    border-top:0;
    border-radius:0 0 12px 12px;
}

@media(max-width:600px){
    #movement{
        top:12px;
        right:12px;
        width:132px;
        height:132px;
        gap:4px;
    }

    .moveButton{font-size:22px}

    #gameBack{
        top:12px;
        left:12px;
        width:82px;
        height:39px;
        font-size:13px;
    }

    #heldGun{
        width:150px;
        height:150px;
        right:0;
        bottom:0;
        transform:scale(.85) rotate(-8deg);
        transform-origin:bottom right;
    }

    #hint{
        font-size:11px;
        bottom:10px;
    }
}
</style>
</head>

<body>

<!-- MAIN MENU -->

<div id="mainScreen">
    <div class="menu">
        <div class="logo">SUBWAY II</div>

        <div class="buttons">
            <button class="menuButton" id="playButton">PLAY</button>
            <button class="menuButton backButton" id="menuBackButton">BACK</button>
        </div>
    </div>
</div>

<!-- GAME -->

<div id="gameScreen">
    <canvas id="gameCanvas"></canvas>

    <button id="gameBack">BACK</button>

    <div id="movement">
        <button class="moveButton" id="forward" aria-label="Move forward">▲</button>
        <button class="moveButton" id="left" aria-label="Move left">◀</button>
        <button class="moveButton" id="backward" aria-label="Move backward">▼</button>
        <button class="moveButton" id="right" aria-label="Move right">▶</button>
    </div>

    <div id="heldGun">
        <div class="barrel"></div>
        <div class="slide"></div>
        <div class="grip"></div>
        <div class="trigger"></div>
    </div>

    <div id="hint">
        DRAG TO LOOK • USE ARROWS TO MOVE • TAP GUN TO PICK UP
    </div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

/* ELEMENTS */

const mainScreen = document.getElementById("mainScreen");
const gameScreen = document.getElementById("gameScreen");
const canvas = document.getElementById("gameCanvas");
const heldGunDisplay = document.getElementById("heldGun");
const hint = document.getElementById("hint");

let renderer = null;
let scene = null;
let camera = null;
let gunPickup = null;
let gunHeld = null;

let playing = false;
let initialized = false;
let hasGun = false;

let playerX = 0;
let playerZ = 3;

let yaw = 0;
let pitch = 0;

let dragging = false;
let dragPointerId = null;
let dragStartX = 0;
let dragStartY = 0;
let lastX = 0;
let lastY = 0;
let pointerMoved = false;

let animationId = null;
let previousTime = 0;

const keys = {
    forward:false,
    backward:false,
    left:false,
    right:false
};

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

/* MATERIALS AND OBJECTS */

function material(color, roughness=1, metalness=0){
    return new THREE.MeshStandardMaterial({
        color,
        roughness,
        metalness
    });
}

function box(parent,size,position,mat){
    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(size[0],size[1],size[2]),
        mat
    );

    mesh.position.set(position[0],position[1],position[2]);
    parent.add(mesh);

    return mesh;
}

/* CREATE 3D GUN */

function createGun(parent,held=false){
    const gun = new THREE.Group();

    const metal = material(0x777777,0.55,0.35);
    const lightMetal = material(0x999999,0.5,0.35);
    const darkMetal = material(0x292929,0.8,0.1);

    // Main body
    box(gun,[0.20,0.17,0.64],[0,0.05,0],metal);

    // Upper slide
    box(gun,[0.16,0.09,0.46],[0,0.15,-0.015],lightMetal);

    // Barrel
    box(gun,[0.105,0.105,0.36],[0,0.12,-0.47],darkMetal);
    box(gun,[0.07,0.07,0.045],[0,0.12,-0.66],material(0x111111));

    // Grip
    const grip = box(
        gun,
        [0.17,0.34,0.20],
        [0,-0.19,0.16],
        darkMetal
    );

    grip.rotation.x=-0.20;

    // Grip lines
    for(let i=0;i<4;i++){
        const line=box(
            gun,
            [0.176,0.018,0.205],
            [0,-0.11-i*0.065,0.16],
            material(0x505050)
        );

        line.rotation.x=-0.20;
    }

    // Trigger guard
    const guard=new THREE.Mesh(
        new THREE.TorusGeometry(0.075,0.012,6,12,Math.PI),
        darkMetal
    );

    guard.rotation.x=Math.PI/2;
    guard.position.set(0,-0.08,0.12);
    gun.add(guard);

    if(held){
        gun.scale.set(0.8,0.8,0.8);
        gun.position.set(0.34,-0.29,-0.65);
        gun.rotation.set(0.08,-0.12,0.02);
    }

    parent.add(gun);
    return gun;
}

/* BUILD ROOM */

function buildWorld(){
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x858585);
    scene.fog = new THREE.Fog(0x858585,22,45);

    camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth/window.innerHeight,
        0.1,
        100
    );

    camera.rotation.order="YXZ";
    camera.position.set(playerX,1.7,playerZ);

    renderer = new THREE.WebGLRenderer({
        canvas,
        antialias:true
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    renderer.setSize(window.innerWidth,window.innerHeight);
    renderer.outputColorSpace=THREE.SRGBColorSpace;
    renderer.toneMapping=THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure=1.15;

    // Lighting
    scene.add(new THREE.HemisphereLight(0xffffff,0x555555,2));

    const light=new THREE.DirectionalLight(0xffffff,2);
    light.position.set(-4,9,5);
    scene.add(light);

    // Room materials
    const floorMat=material(0x696969);
    const wallMat=material(0x929292);
    const sideMat=material(0x777777);
    const ceilingMat=material(0xa1a1a1);

    // Floor and ceiling
    box(scene,[12,0.2,12],[0,-0.1,0],floorMat);
    box(scene,[12,0.2,12],[0,4.2,0],ceilingMat);

    // Walls
    box(scene,[12,4,0.2],[0,2,-6],wallMat);
    box(scene,[12,4,0.2],[0,2,6],wallMat);
    box(scene,[0.2,4,12],[-6,2,0],sideMat);
    box(scene,[0.2,4,12],[6,2,0],sideMat);

    // Floor grid
    const lineMat=material(0x626262);

    for(let i=-5;i<=5;i++){
        box(scene,[0.015,0.008,12],[i,0.006,0],lineMat);
        box(scene,[12,0.008,0.015],[0,0.006,i],lineMat);
    }

    // Gun on the floor, ahead of the player
    gunPickup=new THREE.Group();
    gunPickup.position.set(0,0.18,0.7);
    gunPickup.rotation.y=0.25;

    createGun(gunPickup,false);
    scene.add(gunPickup);

    // Attach held gun to camera
    scene.add(camera);

    gunHeld=createGun(camera,true);
    gunHeld.visible=false;
}

/* CAMERA */

function updateCamera(){
    camera.rotation.order="YXZ";
    camera.rotation.y=yaw;
    camera.rotation.x=pitch;

    camera.position.set(playerX,1.7,playerZ);
}

/* RESET CONTROLS */

function clearControls(){
    for(const key in keys){
        keys[key]=false;
    }

    document.querySelectorAll(".moveButton").forEach(button=>{
        button.classList.remove("active");
    });

    dragging=false;
    dragPointerId=null;
}

/* START GAME */

function startGame(){
    mainScreen.style.display="none";
    gameScreen.style.display="block";

    if(!initialized){
        buildWorld();
        initialized=true;
    }

    playerX=0;
    playerZ=3;

    yaw=0;
    pitch=0;

    hasGun=false;

    gunPickup.visible=true;
    gunHeld.visible=false;
    heldGunDisplay.style.display="none";

    hint.textContent="DRAG TO LOOK • USE ARROWS TO MOVE • TAP GUN TO PICK UP";

    clearControls();
    updateCamera();

    playing=true;

    previousTime=performance.now();

    if(animationId!==null){
        cancelAnimationFrame(animationId);
        animationId=null;
    }

    animate(previousTime);

    renderer.setSize(window.innerWidth,window.innerHeight);
}

/* RETURN TO MENU */

function backToMenu(){
    playing=false;

    if(animationId!==null){
        cancelAnimationFrame(animationId);
        animationId=null;
    }

    clearControls();

    gameScreen.style.display="none";
    mainScreen.style.display="flex";
}

document.getElementById("playButton").addEventListener("click",startGame);

document.getElementById("menuBackButton").addEventListener("click",()=>{
    window.location.href="index.html";
});

document.getElementById("gameBack").addEventListener("click",backToMenu);

/* MOVEMENT BUTTONS */

const movementButtons={
    forward:document.getElementById("forward"),
    backward:document.getElementById("backward"),
    left:document.getElementById("left"),
    right:document.getElementById("right")
};

for(const [direction,button] of Object.entries(movementButtons)){

    button.addEventListener("pointerdown",event=>{
        event.preventDefault();
        event.stopPropagation();

        keys[direction]=true;
        button.classList.add("active");

        try{
            button.setPointerCapture(event.pointerId);
        }catch(error){}
    });

    function release(event){
        keys[direction]=false;
        button.classList.remove("active");
    }

    button.addEventListener("pointerup",release);
    button.addEventListener("pointercancel",release);
    button.addEventListener("lostpointercapture",release);

    button.addEventListener("contextmenu",event=>{
        event.preventDefault();
    });
}

/* KEYBOARD CONTROLS */

const keyboardMap={
    ArrowUp:"forward",
    KeyW:"forward",

    ArrowDown:"backward",
    KeyS:"backward",

    ArrowLeft:"left",
    KeyA:"left",

    ArrowRight:"right",
    KeyD:"right"
};

window.addEventListener("keydown",event=>{
    if(!playing) return;

    const direction=keyboardMap[event.code];

    if(direction){
        keys[direction]=true;
        event.preventDefault();
    }
});

window.addEventListener("keyup",event=>{
    const direction=keyboardMap[event.code];

    if(direction){
        keys[direction]=false;
        event.preventDefault();
    }
});

window.addEventListener("blur",clearControls);

/* CAMERA LOOK AND GUN PICKUP */

/*
   Only the canvas handles camera dragging.
   UI buttons are separate, so pressing movement buttons
   cannot accidentally rotate the camera.
*/

canvas.addEventListener("pointerdown",event=>{
    if(!playing) return;

    // Desktop: only the left mouse button.
    if(event.pointerType==="mouse" && event.button!==0) return;

    dragging=true;
    dragPointerId=event.pointerId;

    dragStartX=event.clientX;
    dragStartY=event.clientY;

    lastX=event.clientX;
    lastY=event.clientY;

    pointerMoved=false;

    try{
        canvas.setPointerCapture(event.pointerId);
    }catch(error){}

    event.preventDefault();
});

canvas.addEventListener("pointermove",event=>{
    if(!playing || !dragging || event.pointerId!==dragPointerId) return;

    const dx=event.clientX-lastX;
    const dy=event.clientY-lastY;

    if(Math.abs(event.clientX-dragStartX)>3 ||
       Math.abs(event.clientY-dragStartY)>3){
        pointerMoved=true;
    }

    // Horizontal and vertical camera look
    yaw-=dx*0.004;
    pitch-=dy*0.003;

    // Prevent flipping upside down
    pitch=THREE.MathUtils.clamp(pitch,-1.35,1.35);

    lastX=event.clientX;
    lastY=event.clientY;

    event.preventDefault();
});

function attemptPickup(clientX,clientY){
    if(!playing || hasGun || !gunPickup || !gunPickup.visible) return;

    const rect=canvas.getBoundingClientRect();

    pointer.x=((clientX-rect.left)/rect.width)*2-1;
    pointer.y=-((clientY-rect.top)/rect.height)*2+1;

    raycaster.setFromCamera(pointer,camera);

    const hits=raycaster.intersectObject(gunPickup,true);

    if(hits.length>0){
        hasGun=true;

        gunPickup.visible=false;
        gunHeld.visible=true;
        heldGunDisplay.style.display="block";

        hint.textContent="GUN PICKED UP";
    }
}

canvas.addEventListener("pointerup",event=>{
    if(!dragging || event.pointerId!==dragPointerId) return;

    const moved=pointerMoved;
    const x=event.clientX;
    const y=event.clientY;

    dragging=false;
    dragPointerId=null;

    // A tap or click picks up the gun.
    // A drag only rotates the camera.
    if(!moved){
        attemptPickup(x,y);
    }

    event.preventDefault();
});

canvas.addEventListener("pointercancel",event=>{
    if(event.pointerId===dragPointerId){
        dragging=false;
        dragPointerId=null;
    }
});

canvas.addEventListener("contextmenu",event=>{
    event.preventDefault();
});

/* GAME LOOP */

function animate(now){
    if(!playing){
        animationId=null;
        return;
    }

    animationId=requestAnimationFrame(animate);

    const dt=Math.min((now-previousTime)/1000,0.05);
    previousTime=now;

    // Forward/backward and strafe input
    let forward=Number(keys.forward)-Number(keys.backward);
    let sideways=Number(keys.right)-Number(keys.left);

    // Diagonal movement should not be faster
    const length=Math.hypot(forward,sideways);

    if(length>1){
        forward/=length;
        sideways/=length;
    }

    const speed=4*dt;

    /*
      Camera faces -Z at yaw = 0.
      Movement uses the camera's current yaw.
    */

    playerX += (
        -Math.sin(yaw)*forward +
        Math.cos(yaw)*sideways
    )*speed;

    playerZ += (
        -Math.cos(yaw)*forward -
        Math.sin(yaw)*sideways
    )*speed;

    // Stay inside the room
    playerX=THREE.MathUtils.clamp(playerX,-5.35,5.35);
    playerZ=THREE.MathUtils.clamp(playerZ,-5.35,5.35);

    updateCamera();

    // Gentle floating animation for the pickup
    if(gunPickup && gunPickup.visible){
        gunPickup.rotation.y+=dt*0.35;
        gunPickup.position.y=0.18+Math.sin(now*0.002)*0.025;
    }

    renderer.render(scene,camera);
}

/* RESIZE */

window.addEventListener("resize",()=>{
    if(!renderer || !camera) return;

    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>

</body>
</html>
