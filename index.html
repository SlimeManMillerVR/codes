
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CODE MACHINE</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 75px 0;
    background: radial-gradient(circle at 50% 40%, #55406f 0%, #352448 45%, #21182f 100%);
    color: white;
    font-family: Arial, sans-serif;
}

.machine {
    width: min(380px, 90%);
    padding: 32px 26px;
    background: rgba(20, 15, 29, 0.88);
    border: 1px solid #765b91;
    border-radius: 12px;
    box-shadow: 0 0 35px rgba(120, 77, 160, 0.18);
    text-align: center;
}

h1 {
    margin: 0 0 28px;
    font-size: 27px;
    letter-spacing: 4px;
    font-weight: 800;
}

input, textarea {
    width: 100%;
    padding: 14px;
    background: #17121f;
    border: 1px solid #68517c;
    border-radius: 5px;
    outline: none;
    color: white;
    font-size: 15px;
}

#codeInput {
    text-align: center;
    letter-spacing: 1px;
}

input::placeholder, textarea::placeholder {
    color: #8e819b;
}

input:focus, textarea:focus {
    border-color: #b58cde;
    box-shadow: 0 0 10px #78549b55;
}

button {
    width: 100%;
    margin-top: 14px;
    padding: 13px;
    border: none;
    border-radius: 5px;
    background: #76509a;
    color: white;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
}

button:hover { background: #9065b8; }
button:active { transform: scale(0.98); }

#result {
    min-height: 18px;
    margin-top: 20px;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #ff5555;
    overflow-wrap: anywhere;
}

/* ANNOUNCEMENT */

#announcementBar {
    display: none;
    position: fixed;
    z-index: 10;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: min(700px, calc(100% - 24px));
    padding: 14px 18px;
    border: 1px solid #b58cde;
    border-radius: 8px;
    background: rgba(20, 15, 29, 0.97);
    box-shadow: 0 0 20px #78549b44;
    text-align: center;
    overflow-wrap: anywhere;
}

.announcement-label {
    display: block;
    margin-bottom: 6px;
    color: #cba8f0;
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 3px;
}

#announcementText {
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
}

/* ADMIN */

#adminToggle {
    position: fixed;
    z-index: 20;
    right: 15px;
    bottom: 15px;
    width: auto;
    margin: 0;
    padding: 11px 16px;
    border: 1px solid #765b91;
    background: #21182f;
    font-size: 11px;
}

#adminPanel {
    display: none;
    position: fixed;
    z-index: 30;
    inset: 0;
    padding: 18px;
    background: rgba(8, 6, 13, 0.82);
    justify-content: center;
    align-items: center;
}

.admin-box {
    position: relative;
    width: min(400px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    padding: 28px 24px;
    background: #20182b;
    border: 1px solid #765b91;
    border-radius: 10px;
    box-shadow: 0 0 35px #0008;
}

.admin-box h2 {
    margin: 0 35px 22px 0;
    font-size: 19px;
    letter-spacing: 3px;
}

#closeAdmin {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 34px;
    height: 34px;
    margin: 0;
    padding: 0;
    background: #392b48;
    font-size: 20px;
    letter-spacing: 0;
}

.admin-field { margin-top: 12px; }

.admin-field label {
    display: block;
    margin-bottom: 7px;
    color: #c5b0d8;
    font-size: 11px;
    letter-spacing: 1px;
}

.admin-field input, .admin-field textarea {
    font-size: 14px;
}

.admin-field textarea {
    min-height: 110px;
    resize: vertical;
    font-family: Arial, sans-serif;
}

#adminStatus {
    margin-top: 14px;
    font-size: 12px;
    line-height: 1.5;
    color: #d7c5e9;
    overflow-wrap: anywhere;
}

#logoutButton { background: #493052; }

.admin-note {
    margin-top: 12px;
    color: #9f90ac;
    font-size: 11px;
    line-height: 1.5;
}

@media (max-width: 420px) {
    .machine { padding: 28px 20px; }
    h1 { font-size: 23px; }
    #announcementText { font-size: 13px; }
}
</style>
</head>

<body>

<div id="announcementBar" role="status" aria-live="polite">
    <span class="announcement-label">ANNOUNCEMENT</span>
    <div id="announcementText"></div>
</div>

<div class="machine">
    <h1>CODE MACHINE</h1>

    <input
        type="text"
        id="codeInput"
        placeholder="ENTER CODE"
        autocomplete="off"
    >

    <button id="checkButton">CHECK</button>
    <div id="result"></div>
</div>

<button id="adminToggle" type="button">ADMIN</button>

<div id="adminPanel">
    <div class="admin-box">
        <button id="closeAdmin" type="button" aria-label="Close">X</button>

        <h2>ADMIN PANEL</h2>

        <div id="loginSection">
            <div class="admin-field">
               <label for="adminEmail">USER</label>
<input id="adminEmail" type="email"
       placeholder="USER" autocomplete="username">
            </div>

            <div class="admin-field">
                <label for="adminPassword">PASSWORD</label>
                <input id="adminPassword" type="password"
                       placeholder="Admin password" autocomplete="current-password">
            </div>

            <button id="loginButton" type="button">LOGIN</button>
        </div>

        <div id="publisherSection" style="display:none">
            <div class="admin-field">
                <label for="announcementInput">ANNOUNCEMENT MESSAGE</label>
                <textarea id="announcementInput" maxlength="500"
                          placeholder="Write an announcement..."></textarea>
            </div>

            <button id="postButton" type="button">PUBLISH ANNOUNCEMENT</button>
            <button id="clearButton" type="button">CLEAR ANNOUNCEMENT</button>
            <button id="logoutButton" type="button">LOG OUT</button>
        </div>

        <div id="adminStatus" role="status" aria-live="polite"></div>

        <div class="admin-note">
            Only the authorized administrator can publish announcements.
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getDatabase,
    ref,
    onValue,
    set
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* YOUR FIREBASE CONFIGURATION */
const firebaseConfig = {
    apiKey: "AIzaSyBDcW0zOlMWTathHTrSk-ur6Jb4NTGRqfE",
    authDomain: "hub-announcements.firebaseapp.com",
    databaseURL: "https://hub-announcements-default-rtdb.firebaseio.com",
    projectId: "hub-announcements",
    storageBucket: "hub-announcements.firebasestorage.app",
    messagingSenderId: "90090581221",
    appId: "1:90090581221:web:3f0ff32f7666a01fc8780c"
};

/* ADMIN UID */
const ADMIN_UID = "udkvYC3s6lQ2eb6Qc2OlWEwijEU2";

const $ = id => document.getElementById(id);

const codeInput = $("codeInput");
const result = $("result");

function checkCode() {
    const code = codeInput.value.trim().toUpperCase();

    if (code === "SUBWAY1") {
        location.href = "subway1.html";
    } else if (code === "SUBWAY2") {
        location.href = "subway2.html";
    } else if (code === "PROFILE") {
        location.href = "profiles.html";
    } else {
        result.textContent = "INVALID CODE";
    }
}

$("checkButton").addEventListener("click", checkCode);

codeInput.addEventListener("keydown", event => {
    if (event.key === "Enter") checkCode();
});

codeInput.addEventListener("input", () => {
    result.textContent = "";
});

/* PANEL CONTROLS */

$("adminToggle").addEventListener("click", () => {
    $("adminPanel").style.display = "flex";
});

function closePanel() {
    $("adminPanel").style.display = "none";
}

$("closeAdmin").addEventListener("click", closePanel);

$("adminPanel").addEventListener("click", event => {
    if (event.target === $("adminPanel")) closePanel();
});

document.addEventListener("keydown", event => {
    if (event.key === "Escape") closePanel();
});

function status(message, error = false) {
    $("adminStatus").textContent = message;
    $("adminStatus").style.color = error ? "#ff7777" : "#c5f5c5";
}

function showLogin() {
    $("loginSection").style.display = "block";
    $("publisherSection").style.display = "none";
}

function showPublisher() {
    $("loginSection").style.display = "none";
    $("publisherSection").style.display = "block";
}

/* FIREBASE */

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const announcementRef = ref(db, "announcement");

let isAdmin = false;

/* LIVE ANNOUNCEMENTS FOR EVERY VISITOR */

onValue(announcementRef, snapshot => {
    const message = snapshot.val();

    if (typeof message === "string" && message.trim()) {
        $("announcementText").textContent = message;
        $("announcementBar").style.display = "block";
    } else {
        $("announcementText").textContent = "";
        $("announcementBar").style.display = "none";
    }
}, error => {
    console.error("Announcement read error:", error);
});

/* AUTHENTICATION */

onAuthStateChanged(auth, user => {
    isAdmin = !!user && user.uid === ADMIN_UID;

    if (isAdmin) {
        showPublisher();
        status("Admin authenticated.");
    } else {
        showLogin();

        if (user) {
            status("This account is not authorized.", true);
        } else {
            status("Log in with your administrator account.");
        }
    }
});

/* LOGIN */

$("loginButton").addEventListener("click", async () => {
    const email = $("adminEmail").value.trim();
    const password = $("adminPassword").value;

    if (!email || !password) {
        status("Enter your email and password.", true);
        return;
    }

    $("loginButton").disabled = true;
    status("Logging in...");

    try {
        const credential = await signInWithEmailAndPassword(
            auth, email, password
        );

        if (credential.user.uid !== ADMIN_UID) {
            await signOut(auth);
            status("This account is not authorized as admin.", true);
        }
    } catch (error) {
        console.error(error);
        status("Login failed. Check your email and password.", true);
    } finally {
        $("loginButton").disabled = false;
    }
});

$("adminPassword").addEventListener("keydown", event => {
    if (event.key === "Enter") $("loginButton").click();
});

/* PUBLISH */

$("postButton").addEventListener("click", async () => {
    const user = auth.currentUser;
    const message = $("announcementInput").value.trim();

    if (!user || user.uid !== ADMIN_UID || !isAdmin) {
        status("Not authorized to publish.", true);
        return;
    }

    if (!message) {
        status("Write an announcement first.", true);
        return;
    }

    $("postButton").disabled = true;
    status("Publishing...");

    try {
        await set(announcementRef, message);
        $("announcementInput").value = "";
        status("Announcement published!");
    } catch (error) {
        console.error(error);
        status("Publish failed. Check your database rules.", true);
    } finally {
        $("postButton").disabled = false;
    }
});

/* CLEAR ANNOUNCEMENT */

$("clearButton").addEventListener("click", async () => {
    const user = auth.currentUser;

    if (!user || user.uid !== ADMIN_UID || !isAdmin) {
        status("Not authorized to clear announcements.", true);
        return;
    }

    $("clearButton").disabled = true;

    try {
        await set(announcementRef, null);
        status("Announcement cleared.");
    } catch (error) {
        console.error(error);
        status("Could not clear the announcement.", true);
    } finally {
        $("clearButton").disabled = false;
    }
});

/* LOG OUT */

$("logoutButton").addEventListener("click", async () => {
    try {
        await signOut(auth);
        $("adminPassword").value = "";
        status("Logged out.");
    } catch (error) {
        console.error(error);
        status("Could not log out.", true);
    }
});
</script>

</body>
</html>
