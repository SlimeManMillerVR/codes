
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROFILES</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 0;
    background: #c4a17e;
    font-family: Arial, sans-serif;
    color: white;
}

.profile-screen {
    width: min(440px, 90%);
    padding: 32px 26px;
    background: #8d6b4e;
    border: 1px solid #6f5037;
    border-radius: 8px;
    box-shadow: 0 10px 30px #60452d40;
    text-align: center;
}

h1 {
    margin: 0 0 28px;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 5px;
    color: #f6e7d5;
}

.search-bar {
    display: flex;
    width: 100%;
    gap: 8px;
}

input {
    min-width: 0;
    flex: 1;
    width: 100%;
    padding: 14px 12px;
    background: #ead8c2;
    border: 1px solid #6f5037;
    border-radius: 4px;
    outline: none;
    color: #382719;
    font-size: 15px;
}

input::placeholder {
    color: #80664e;
}

input:focus {
    border-color: #fff0dc;
    box-shadow: 0 0 8px #ffffff40;
}

button {
    padding: 12px 16px;
    background: #5d402c;
    border: 1px solid #49301f;
    border-radius: 4px;
    color: white;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
}

button:hover {
    background: #704e35;
}

#result {
    display: none;
    margin-top: 24px;
    color: #ffe1d9;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 2px;
}

.profile-card {
    display: none;
    margin-top: 28px;
    padding: 18px;
    background: #6f5039;
    border: 1px solid #543b29;
    border-radius: 7px;
    text-align: left;
}

.profile-info {
    display: flex;
    align-items: center;
    gap: 15px;
    min-height: 66px;
}

.profile-circle {
    width: 58px;
    height: 58px;
    min-width: 58px;
    border-radius: 50%;
    background: #c9a17c;
    border: 2px solid #e0c1a0;
}

.profile-text {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.profile-name {
    display: flex;
    align-items: center;
    gap: 7px;
    color: #fff0df;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 2px;
}

.profile-tag {
    color: #d2b69b;
    font-size: 12px;
    letter-spacing: 1px;
}

.verified-star {
    color: #36a9ff;
    font-size: 21px;
    line-height: 1;
    letter-spacing: 0;
}

.close-button {
    display: block;
    width: 100%;
    margin-top: 22px;
    padding: 12px;
    background: #49301f;
    border: 1px solid #3b2619;
}

.close-button:hover {
    background: #382316;
}
</style>
</head>

<body>

<div class="profile-screen">
    <h1>PROFILES</h1>

    <div class="search-bar">
        <input
            type="text"
            id="searchInput"
            placeholder="SEARCH"
            autocomplete="off"
        >

        <button id="searchButton">SEARCH</button>
    </div>

    <div id="result">COULDN'T FIND PROFILE</div>

    <!-- FILES PROFILE -->
    <div class="profile-card" id="filesProfile">
        <div class="profile-info">
            <div class="profile-circle"></div>

            <div class="profile-text">
                <div class="profile-name">
                    FILES
                    <span class="verified-star">★</span>
                </div>
                <div class="profile-tag">#FILE</div>
            </div>
        </div>

        <button class="close-button">CLOSE</button>
    </div>

    <!-- COOLEST_GUY PROFILE -->
    <div class="profile-card" id="coolestProfile">
        <div class="profile-info">
            <div class="profile-circle"></div>

            <div class="profile-text">
                <div class="profile-name">COOLEST_GUY</div>
                <div class="profile-tag">#COOLEST</div>
            </div>
        </div>

        <button class="close-button">CLOSE</button>
    </div>
</div>

<script>
const searchInput = document.getElementById("searchInput");
const searchButton = document.getElementById("searchButton");
const result = document.getElementById("result");

const filesProfile = document.getElementById("filesProfile");
const coolestProfile = document.getElementById("coolestProfile");

function hideProfiles() {
    filesProfile.style.display = "none";
    coolestProfile.style.display = "none";
}

function searchProfile() {
    const search = searchInput.value.trim().toUpperCase();

    hideProfiles();
    result.style.display = "none";

    if (search === "FILE" || search === "FILES") {
        filesProfile.style.display = "block";
    }
    else if (search === "COOLEST") {
        coolestProfile.style.display = "block";
    }
    else {
        result.textContent = "COULDN'T FIND PROFILE";
        result.style.display = "block";
    }
}

searchButton.addEventListener("click", searchProfile);

searchInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        searchProfile();
    }
});

document.querySelectorAll(".close-button").forEach(function(button) {
    button.addEventListener("click", function() {
        button.closest(".profile-card").style.display = "none";
    });
});
</script>

</body>
</html>
