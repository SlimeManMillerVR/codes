
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUBWAY I (BETA)</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: "Arial Black", Impact, sans-serif;
    color: white;

    background:
        linear-gradient(135deg, #9be7ff 0%, #83b9f5 35%,
        #9c8be9 65%, #c6a5f5 100%);
    position: relative;
}

/* Minecraft-style pixel background */
body::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(rgba(255,255,255,0.09) 2px, transparent 2px),
        linear-gradient(90deg, rgba(255,255,255,0.09) 2px, transparent 2px);
    background-size: 48px 48px;
    pointer-events: none;
}

.menu {
    position: relative;
    z-index: 1;
    width: min(440px, 90%);
    text-align: center;
    padding: 25px 20px;
}

.logo {
    font-size: clamp(42px, 10vw, 66px);
    font-weight: 1000;
    line-height: 1;
    letter-spacing: -2px;
    color: white;
    text-shadow:
        4px 4px 0 #555078,
        7px 7px 0 #38314f,
        0 0 20px rgba(255,255,255,0.3);
    transform: rotate(-5deg);
    margin-bottom: 4px;
}

.beta {
    color: #ffeb36;
    font-size: 23px;
    letter-spacing: 3px;
    text-shadow:
        2px 2px 0 #9b6717,
        3px 3px 0 #64451b;
    transform: rotate(-5deg);
    margin-bottom: 35px;
}

.buttons {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin: 0 auto;
    width: min(290px, 100%);
}

button {
    width: 100%;
    min-height: 55px;
    font-family: "Arial Black", Impact, sans-serif;
    font-size: 21px;
    font-weight: 900;
    letter-spacing: 2px;
    color: white;
    background: #6e64b9;
    border: 3px solid #514582;
    border-radius: 2px;
    box-shadow: 0 6px 0 #42375f;
    cursor: pointer;
    transition: transform 0.12s, background 0.12s;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.25);
}

button:hover {
    background: #8278d4;
    transform: translateY(-2px);
}

button:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #42375f;
}

.back {
    background: #559dc9;
    border-color: #38769e;
    box-shadow: 0 6px 0 #285776;
}

.back:hover {
    background: #69b4e0;
}

.back:active {
    box-shadow: 0 2px 0 #285776;
}

</style>
</head>

<body>

<div class="menu">

    <div class="logo">SUBWAY I</div>
    <div class="beta">(BETA)</div>

    <div class="buttons">
        <button id="playButton">PLAY</button>
        <button id="settingsButton">SETTINGS</button>
        <button class="back" id="backButton">BACK</button>
    </div>

</div>

<script>
document.getElementById("playButton").addEventListener("click", function() {
    // Coming soon
});

document.getElementById("settingsButton").addEventListener("click", function() {
    // Settings coming soon
});

document.getElementById("backButton").addEventListener("click", function() {
    window.location.href = "index.html";
});
</script>

</body>
</html>
