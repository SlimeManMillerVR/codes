
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOOD</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:#c9a477;font-family:Arial,sans-serif;color:#fff0d9}
#moneyArea{position:fixed;top:18px;right:20px;z-index:5;display:flex;align-items:center;gap:8px}
#money{padding:12px 17px;background:#50321f;border:2px solid #3b2518;border-radius:5px;color:#fff0d9;font-size:19px;font-weight:900;letter-spacing:2px}
#addMoney{width:43px;height:43px;margin:0;padding:0;background:#50321f;border:2px solid #3b2518;border-radius:5px;color:#fff0d9;font-size:25px;font-weight:bold;cursor:pointer}
#addMoney:hover{background:#69452c}
.menu{display:flex;flex-direction:column;align-items:center;gap:18px;width:min(300px,85%)}
.menu-button{width:100%;min-height:58px;padding:16px;background:#50321f;border:2px solid #3b2518;border-radius:5px;color:#fff0d9;font-size:16px;font-weight:800;letter-spacing:3px;cursor:pointer;transition:background .2s,transform .2s}
.menu-button:hover{background:#69452c}
.menu-button:active{transform:scale(.97)}
.overlay{display:none;position:fixed;inset:0;z-index:10;justify-content:center;align-items:center;padding:20px;background:rgba(43,27,16,.65)}
.window{position:relative;width:min(700px,100%);max-height:85vh;overflow-y:auto;padding:75px 28px 30px;background:#d8b58b;border:3px solid #50321f;border-radius:8px;box-shadow:0 12px 45px rgba(40,23,12,.4)}
.window-title{position:absolute;top:20px;left:24px;margin:0;color:#50321f;font-size:24px;font-weight:900;letter-spacing:4px}
.close-button{position:absolute;top:14px;right:16px;width:42px;height:42px;margin:0;border:2px solid #3b2518;border-radius:4px;background:#50321f;color:white;font-size:22px;font-weight:bold;cursor:pointer}
.close-button:hover{background:#69452c}
.item-list{display:flex;flex-direction:column;gap:12px}
.inventory-item,.store-item{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:58px;padding:13px 16px;background:#bd9569;border:2px solid #8d6846;border-radius:5px;color:#402817;font-size:15px;font-weight:800;letter-spacing:1px}
.item-count{flex-shrink:0;color:#50321f;font-size:15px}
.product-info{display:flex;flex-direction:column;gap:5px}
.product-name{font-size:15px}
.product-price{color:#65452b;font-size:13px}
.purchase-product{width:auto;min-width:110px;margin:0;padding:12px;border:2px solid #3b2518;border-radius:4px;background:#50321f;color:white;font-size:11px;font-weight:900;letter-spacing:1px;cursor:pointer}
.purchase-product:hover{background:#69452c}
.purchase-product:active{transform:scale(.97)}
.unavailable{color:#75543b;font-size:11px;font-weight:900;letter-spacing:1px}
.craft-requirements{color:#65452b;font-size:12px;line-height:1.5;font-weight:800}
#storeMessage{display:none;margin-top:18px;padding:13px;border:2px solid #8d6846;border-radius:5px;background:#bd9569;color:#50321f;text-align:center;font-size:13px;font-weight:900;letter-spacing:2px;white-space:pre-line}
.coming-soon{margin:28px 0 0;color:#50321f;text-align:center;font-size:14px;font-weight:900;letter-spacing:3px}
@media(max-width:480px){
#moneyArea{top:12px;right:12px;gap:5px}
#money{font-size:16px;padding:12px}
#addMoney{width:40px;height:40px}
.window{padding:70px 16px 24px}
.window-title{left:18px;font-size:21px}
.inventory-item,.store-item{font-size:13px;padding:12px}
.purchase-product{min-width:95px;padding:10px;font-size:10px}
.coming-soon{font-size:12px;letter-spacing:2px}
}
</style>
</head>
<body>

<div id="moneyArea">
  <div id="money">00.00</div>
  <button id="addMoney" type="button" aria-label="Add money">+</button>
</div>

<main class="menu">
  <button class="menu-button" id="inventoryButton" type="button">INVENTORY</button>
  <button class="menu-button" id="purchaseButton" type="button">PURCHASE</button>
</main>

<!-- INVENTORY -->
<div class="overlay" id="inventoryOverlay">
  <section class="window" role="dialog" aria-modal="true" aria-labelledby="inventoryTitle">
    <h1 class="window-title" id="inventoryTitle">INV</h1>
    <button class="close-button" id="closeInventory" type="button" aria-label="Close inventory">X</button>
    <div class="item-list">
      <div class="inventory-item"><span>EGG</span><span class="item-count" id="eggCount">0X</span></div>
      <div class="inventory-item"><span>BREAD</span><span class="item-count" id="breadCount">0X</span></div>
      <div class="inventory-item"><span>BACON</span><span class="item-count" id="baconCount">0X</span></div>
      <div class="inventory-item"><span>BACON AND EGGS</span><span class="item-count" id="comboCount">0X</span></div>
    </div>
    <p class="coming-soon">MORE COMING SOON</p>
  </section>
</div>

<!-- STORE -->
<div class="overlay" id="storeOverlay">
  <section class="window" role="dialog" aria-modal="true" aria-labelledby="storeTitle">
    <h1 class="window-title" id="storeTitle">STORE</h1>
    <button class="close-button" id="closeStore" type="button" aria-label="Close store">X</button>
    <div class="item-list">
      <div class="store-item">
        <div class="product-info"><span class="product-name">EGG</span><span class="product-price">5.00</span></div>
        <button class="purchase-product" data-product="egg" type="button">PURCHASE</button>
      </div>
      <div class="store-item">
        <div class="product-info"><span class="product-name">BREAD</span><span class="product-price">10.00</span></div>
        <button class="purchase-product" data-product="bread" type="button">PURCHASE</button>
      </div>
      <div class="store-item">
        <div class="product-info"><span class="product-name">BACON</span><span class="product-price">5.00</span></div>
        <button class="purchase-product" data-product="bacon" type="button">PURCHASE</button>
      </div>
      <div class="store-item">
        <div class="product-info">
          <span class="product-name">BACON AND EGGS</span>
          <span class="craft-requirements">CRAFTABLE<br>EGG 1X + BACON 1X</span>
        </div>
        <button class="purchase-product" id="craftButton" type="button">CRAFT</button>
      </div>
    </div>
    <div id="storeMessage" role="status" aria-live="polite"></div>
    <p class="coming-soon">MORE COMING SOON</p>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);

const STORAGE_KEY = "foodGameSaveV1";
const ADD_READY_AT_KEY = "foodGameAddReadyAtV1";
const ADD_COOLDOWN_MS = 10000;

const defaultSave = {
  money: 0,
  inventory: { egg: 0, bread: 0, bacon: 0, combo: 0 }
};

let save = loadSave();

function loadSave() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return JSON.parse(JSON.stringify(defaultSave));

    const parsed = JSON.parse(raw);

    return {
      money: Number.isFinite(Number(parsed.money))
        ? Math.max(0, Number(parsed.money))
        : 0,
      inventory: {
        egg: Math.max(0, Number(parsed.inventory?.egg) || 0),
        bread: Math.max(0, Number(parsed.inventory?.bread) || 0),
        bacon: Math.max(0, Number(parsed.inventory?.bacon) || 0),
        combo: Math.max(0, Number(parsed.inventory?.combo) || 0)
      }
    };
  } catch {
    return JSON.parse(JSON.stringify(defaultSave));
  }
}

function saveGame() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(save));
  } catch (error) {
    console.error("Could not save game:", error);
  }
}

function updateUI() {
  $("money").textContent = save.money.toFixed(2);
  $("eggCount").textContent = save.inventory.egg + "X";
  $("breadCount").textContent = save.inventory.bread + "X";
  $("baconCount").textContent = save.inventory.bacon + "X";
  $("comboCount").textContent = save.inventory.combo + "X";
}

const inventoryOverlay = $("inventoryOverlay");
const storeOverlay = $("storeOverlay");
const storeMessage = $("storeMessage");

/* OPEN AND CLOSE INVENTORY */
$("inventoryButton").addEventListener("click", () => {
  updateUI();
  inventoryOverlay.style.display = "flex";
});

$("closeInventory").addEventListener("click", () => {
  inventoryOverlay.style.display = "none";
});

/* OPEN AND CLOSE STORE */
$("purchaseButton").addEventListener("click", () => {
  storeMessage.style.display = "none";
  storeOverlay.style.display = "flex";
});

$("closeStore").addEventListener("click", () => {
  storeOverlay.style.display = "none";
});

/* CLICK OUTSIDE TO CLOSE */
inventoryOverlay.addEventListener("click", event => {
  if (event.target === inventoryOverlay) {
    inventoryOverlay.style.display = "none";
  }
});

storeOverlay.addEventListener("click", event => {
  if (event.target === storeOverlay) {
    storeOverlay.style.display = "none";
  }
});

/* ESCAPE TO CLOSE */
document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    inventoryOverlay.style.display = "none";
    storeOverlay.style.display = "none";
  }
});

/* ADD MONEY: ONE REWARD EVERY 10 SECONDS */
$("addMoney").addEventListener("click", () => {
  const now = Date.now();
  const readyAt = Number(localStorage.getItem(ADD_READY_AT_KEY) || 0);

  if (now < readyAt) {
    $("addMoney").textContent = "!";
    $("addMoney").title = "WAIT!";
    showAddMessage("WAIT!");
    return;
  }

  // Start the 10-second cooldown and save it across page reloads.
  localStorage.setItem(ADD_READY_AT_KEY, String(now + ADD_COOLDOWN_MS));

  $("addMoney").textContent = "!";
  $("addMoney").title = "WAIT!";

  save.money += 15;
  saveGame();
  updateUI();

  showAddMessage("COULDNT FIND ADD");

  window.setTimeout(() => {
    showAddMessage("+15.00");
  }, 900);
});

function showAddMessage(message) {
  let toast = $("addToast");

  if (!toast) {
    toast = document.createElement("div");
    toast.id = "addToast";
    toast.style.cssText =
      "position:fixed;top:75px;right:20px;z-index:20;" +
      "background:#50321f;color:#fff0d9;border:2px solid #3b2518;" +
      "border-radius:5px;padding:12px 15px;font-size:12px;" +
      "font-weight:900;letter-spacing:1px;" +
      "max-width:calc(100vw - 40px);";
    document.body.appendChild(toast);
  }

  toast.textContent = message;
  toast.style.display = "block";

  if (message === "+15.00") {
    window.setTimeout(() => {
      if (toast.textContent === "+15.00") {
        toast.style.display = "none";
      }
    }, 1800);
  }
}

/* PURCHASE EGG, BREAD, OR BACON */
const prices = { egg: 5, bread: 10, bacon: 5 };

document.querySelectorAll(".purchase-product[data-product]").forEach(button => {
  button.addEventListener("click", () => {
    const product = button.dataset.product;
    const price = prices[product];

    if (typeof price !== "number") return;

    if (save.money < price) {
      storeMessage.textContent = "NOT ENOUGH MONEY";
      storeMessage.style.display = "block";
      return;
    }

    save.money = Math.round((save.money - price) * 100) / 100;
    save.inventory[product] += 1;

    saveGame();
    updateUI();

    storeMessage.textContent = product.toUpperCase() + " PURCHASED!";
    storeMessage.style.display = "block";
  });
});

/* CRAFT BACON AND EGGS */
$("craftButton").addEventListener("click", () => {
  if (save.inventory.egg < 1 || save.inventory.bacon < 1) {
    storeMessage.textContent = "NOT ENOUGH MONEY";
    storeMessage.style.display = "block";
    return;
  }

  // Consume one egg and one bacon to craft one combo.
  save.inventory.egg -= 1;
  save.inventory.bacon -= 1;
  save.inventory.combo += 1;

  saveGame();
  updateUI();

  // Close STORE and open inventory after crafting.
  storeOverlay.style.display = "none";
  inventoryOverlay.style.display = "flex";

  let craftNotice = $("craftNotice");

  if (!craftNotice) {
    craftNotice = document.createElement("div");
    craftNotice.id = "craftNotice";
    craftNotice.style.cssText =
      "margin-top:16px;padding:12px;background:#bd9569;" +
      "border:2px solid #8d6846;border-radius:5px;color:#50321f;" +
      "text-align:center;font-size:13px;font-weight:900;letter-spacing:2px;";

    $("inventoryOverlay").querySelector(".item-list").after(craftNotice);
  }

  craftNotice.textContent = "CRAFTED!";
  craftNotice.style.display = "block";

  window.setTimeout(() => {
    craftNotice.style.display = "none";
  }, 2500);
});

/* INITIALIZE */
updateUI();

const savedReadyAt = Number(localStorage.getItem(ADD_READY_AT_KEY) || 0);

if (Date.now() < savedReadyAt) {
  $("addMoney").textContent = "!";
  $("addMoney").title = "WAIT!";
}
</script>
</body>
</html>
